name: Update TikTok archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-tiktok-archive
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spreadsheet reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Read public TikTok spreadsheet
        run: python scripts/update_tiktok_data.py

      - name: Commit changed archive data
        run: |
          if git diff --quiet -- data.js; then
            echo "No changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update TikTok archive data"
          git push
